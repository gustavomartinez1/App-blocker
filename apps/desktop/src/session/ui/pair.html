<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <link rel="stylesheet" href="style.css" />
  <title>Vincular Guardián</title>
</head>
<body>
  <form class="card" id="form" style="text-align:left">
    <div class="big" style="text-align:center">🛡️</div>
    <h1 style="text-align:center">Vincular esta computadora</h1>
    <p>En el panel del administrador: perfil → Dispositivos → “Generar código”.</p>
    <label>Servidor<input id="server" required value="https://" /></label>
    <label>Código de vinculación<input id="code" class="code" required maxlength="9" placeholder="XXXX-XXXX" /></label>
    <label>Nombre del equipo<input id="name" required /></label>
    <div class="row"><button class="primary">Vincular</button></div>
    <div id="result" class="msg"></div>
  </form>
  <script>
    const $ = (id) => document.getElementById(id);
    $('name').value = new URLSearchParams(location.search).get('name') || '';
    $('form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await window.guardian.pair($('server').value.trim(), $('code').value.trim(), $('name').value.trim());
        $('result').className = 'msg ok';
        $('result').textContent = '¡Listo! Este equipo ya está protegido.';
      } catch (err) {
        $('result').className = 'msg err';
        $('result').textContent = err.message.replace(/^Error invoking remote method '[^']+': Error: /, '');
      }
    };
  </script>
</body>
</html>
